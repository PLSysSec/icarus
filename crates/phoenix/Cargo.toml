[package]
name = "phoenix"
version = "0.1.0"
edition = "2024"

[dependencies]
clang = { version = "2.0", features = ["clang_10_0", "runtime"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
cachet-lang = { path = "../cachet-lang" }
serde_json = "1"
serde_yaml = "0.9"
indexmap = { version = "2", features = ["serde"] }
shlex = "1"
